<!DOCTYPE html>
<html>
<head>
    <title>Armstrong Checker</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding-top: 40px;
            background-color: white;
        }
        h2 {
            margin-bottom: 20px;
        }
        input {
            display: block;
            margin: 10px auto;
            padding: 10px;
            width: 200px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            display: block;
            margin: 10px auto;
            padding: 10px 20px;
            background-color: #9c27b0;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #result {
            margin-top: 30px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <h2>Armstrong Number Checker!</h2>
    <input type="number" id="num" placeholder="Enter a number">
    <button onclick="check()">Check Number</button>
    <div id="result"></div>
    <script>
    function check() {
        let n = document.getElementById("num").value;    
        if (n === "") {
            document.getElementById("result").innerHTML = "Enter a number first!";
            return;
        }        
        let k = Number(n);
        let temp = k;     
        let s = 0;
        while (temp > 0) {
            let r = temp % 10;          
            s = s + (r * r * r);         
            temp = Math.floor(temp / 10);
        }        
        if (s == k) {
            document.getElementById("result").innerHTML = k + " is an Armstrong Number!";
        } else {
            document.getElementById("result").innerHTML = k + " is Not an Armstrong Number.";
        }
    }
    </script>
</body>
</html>
