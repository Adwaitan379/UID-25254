<!DOCTYPE html>
<html>
<head>
    <title>Even or Odd Checker</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding-top: 40px;
            background-color: white;
        }
        h2 {
            margin-bottom: 20px;
        }
        input {
            display: block;
            margin: 10px auto;
            padding: 10px;
            width: 200px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            display: block;
            margin: 10px auto;
            padding: 10px 20px;
            background-color: #9c27b0;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #result {
            margin-top: 30px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <h2>It is a Even or Odd?</h2>
    <input type="number" id="num" placeholder="Enter a number">
    <button onclick="check()">Check Number</button>
    <div id="result"></div>
    <script>
        function check() {
            let a = document.getElementById("num").value;
            if (a === "") {
                document.getElementById("result").innerHTML = "type a number first!";
                return;
            }
            if (a % 2 == 0) {
                document.getElementById("result").innerHTML = a + " is an Even Number!";
            } else {
                document.getElementById("result").innerHTML = a + " is an Odd Number!";
            }
        }
    </script>
</body>
</html>
