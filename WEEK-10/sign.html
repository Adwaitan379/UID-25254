<!DOCTYPE html>
<html>
<head>
    <title>Math Sign Checker</title>
</head>
<body>
    <p>Adwaitan-25254</p>
    <h2>Find the Sign</h2>
    <p>Enter three numbers below:</p>
    <input type="number" id="n1" placeholder="First number">
    <input type="number" id="n2" placeholder="Second number">
    <input type="number" id="n3" placeholder="Third number">
    <br><br>
    <button onclick="checkResult()">Check Sign</button>
    <script>
        function checkResult() {
            const a = parseFloat(document.getElementById('n1').value);
            const b = parseFloat(document.getElementById('n2').value);
            const c = parseFloat(document.getElementById('n3').value);
            findProductSign(a, b, c);
        }
        function findProductSign(num1, num2, num3) {
            if (isNaN(num1) || isNaN(num2) || isNaN(num3)) {
                alert("Please enter three numbers first!");
                return;
            }
            const product = num1 * num2 * num3;
            if (product > 0) {
                alert("The sign is +");
            } else if (product < 0) {
                alert("The sign is -");
            } else {
                alert("The product is 0");
            }
        }
    </script>
</body>
</html>
